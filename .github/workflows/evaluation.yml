name: AI Evaluation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  evaluate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      - run: python -m app.evaluation.benchmark

      - run: python -m app.evaluation.evaluator

      - run: python -m app.evaluation.merge_gate